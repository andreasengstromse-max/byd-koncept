<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BYD privatleasing, tre bannerförslag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:#e9ecef;color:#15181c;line-height:1.4}
.page{max-width:1500px;margin:0 auto;padding:28px 20px 60px}
.page>h1{font-size:22px;margin:0 0 4px}
.page>p{margin:0 0 20px;color:#5a626b;font-size:14px}
.label{margin:34px 0 10px;font-size:14px;color:#5a626b}
.label b{color:#15181c;font-size:15px;margin-right:8px}

/* Bannern: helbild, bilarna står direkt på snön i fotot */
.bn{position:relative;overflow:hidden;border-radius:14px;isolation:isolate;container-type:inline-size;display:flex;flex-direction:column;
  aspect-ratio:1440/650;text-decoration:none;color:var(--ink);background-size:cover;background-repeat:no-repeat}
.bn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--veil)}
.top{padding:4.2% 4.6% 0}
.eyebrow{font-size:clamp(10px,.85cqw,12.5px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.bn h2{margin:.35em 0 0;font-weight:700;line-height:1.04;letter-spacing:-.022em;font-size:clamp(22px,3.9cqw,58px)}
.bn h2 span{display:block}
.bn h2 .l2{font-weight:500}
.meta{display:flex;align-items:center;gap:22px;margin-top:1.7cqw}
.cta{padding:.95em 1.9em;border-radius:999px;font-weight:600;font-size:clamp(12px,1cqw,14.5px);background:var(--btn);color:var(--btnink)}
.sub{font-size:clamp(11px,.92cqw,13.5px);font-weight:500;opacity:.8}

.line{display:grid;grid-template-columns:repeat(7,1fr);column-gap:1%;padding:0 2.6% 2.6%;margin-top:auto;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.car{width:100%;position:relative}
.car::after{content:"";position:absolute;left:5%;right:1%;bottom:-5%;height:20%;background:radial-gradient(ellipse at 50% 50%,var(--shade),transparent 70%);filter:blur(3px);z-index:-1}
.car img{width:100%;display:block}
.name{margin-top:1.5cqw;font-size:clamp(7px,.78cqw,11.5px);font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:.72}
.pr{margin-top:.15em;font-size:clamp(7px,.9cqw,13px);font-weight:500;white-space:nowrap}
.pr b{font-size:clamp(11px,1.55cqw,23px);font-weight:700;letter-spacing:-.01em;margin:0 .12em}

.b1{--ink:#17222d;--accent:#c8102e;--btn:#17222d;--btnink:#fff;--shade:rgba(40,62,92,.5);
  --veil:linear-gradient(100deg,rgba(243,247,251,.88),rgba(243,247,251,.5) 38%,rgba(243,247,251,0) 62%),linear-gradient(0deg,rgba(255,255,255,.92),rgba(255,255,255,0) 36%);
  background-color:#dfe7ee;background-image:url("https://images.unsplash.com/photo-1507281736509-c6289f1ea0f8?auto=format&fit=crop&w=2400&q=78");background-position:center 12%}
.b2{--ink:#1d2a26;--accent:#2f5d50;--btn:#1d2a26;--btnink:#fff;--shade:rgba(46,66,92,.5);
  --veil:linear-gradient(100deg,rgba(250,250,250,.85),rgba(250,250,250,.4) 40%,rgba(250,250,250,0) 64%),linear-gradient(0deg,rgba(255,255,255,.9),rgba(255,255,255,0) 36%);
  background-color:#e3e9ee;background-image:url("https://images.unsplash.com/photo-1739952460691-d8d63d2ad0ae?auto=format&fit=crop&w=2400&q=78");background-position:center 30%}
.b3{--ink:#fff;--accent:#8ff0d2;--btn:#fff;--btnink:#0b1d30;--shade:rgba(0,0,0,.75);
  --veil:linear-gradient(rgba(3,10,22,.55),rgba(3,10,22,0) 46%),linear-gradient(0deg,rgba(4,12,26,.92),rgba(4,12,26,.5) 22%,rgba(4,12,26,0) 44%);
  background-color:#0b1d30;background-image:url("https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=2400&q=78");background-position:center 40%}

@media (max-width:760px){
  .page{padding:18px 12px 40px}
  .bn{aspect-ratio:auto;border-radius:10px;background-size:auto 46%;background-position:center top;background-color:var(--ground)}
  .b1{--ground:#fff}.b2{--ground:#fff}.b3{--ground:#050d1c}
  .bn::before{background:linear-gradient(rgba(255,255,255,0) 30%,var(--ground) 46%),var(--veil)}
  .top{padding:30px 22px 0}
  .bn h2{font-size:30px}
  .meta{flex-direction:column;align-items:flex-start;gap:12px;margin-top:16px}
  .cta{font-size:14px}.sub{font-size:12px}
  .line{grid-template-columns:repeat(2,1fr);column-gap:7%;row-gap:26px;padding:34px 7% 30px;margin-top:0}
  .col:first-child{grid-column:1/-1}
  .col:first-child .car{width:62%}
  .name{font-size:10.5px;margin-top:12px}.pr{font-size:12px}.pr b{font-size:19px}
}
</style>
</head>
<body>
<div class="page">
  <h1>Privatleasing på startsidan, tre bannerförslag</h1>
  <p>Helbild med bilarna stående direkt på snön. Sju modeller i lika breda kolumner på samma linje, ett pris per modell.</p>
  <div id="out"></div>
</div>
<script>
const NB=' ';
const CARS=[['dolphin-g-dmi','Dolphin G DM-i',2990],['atto-2-dmi','Atto 2 DM-i',3490],['atto-2','Atto 2',3890],['seal-6-dmi-touring','Seal 6 DM-i Touring',3490],['atto-3-evo','Atto 3 EVO',4290],['seal-u-dmi','Seal U DM-i',4190],['sealion-7','Sealion 7',5990]];
const kr=n=>String(n).replace(/(\d)(\d{3})$/,'$1'+NB+'$2');
const line=()=>`<div class="line">${CARS.map(([id,n,p])=>`<div class="col"><div class="car"><img src="media/cars/${id}.webp" alt="BYD ${n}"></div><div class="name">${n}</div><div class="pr">från<b>${kr(p)}</b>kr/mån</div></div>`).join('')}</div>`;
const B=[
 ['b1','Förslag 1','Fjällvidd i dagsljus.','Privatleasing',['Hela BYD-familjen.','Från 2'+NB+'990'+NB+'kr/mån.'],'Se alla modeller'],
 ['b2','Förslag 2','Snötäckt vidd i motljus.','Privatleasing',['En BYD för varje behov.','Från 2'+NB+'990'+NB+'kr/mån.'],'Hitta din BYD'],
 ['b3','Förslag 3','Norrsken över snön.','Vinterns privatleasing',['Hela BYD-familjen.','Från 2'+NB+'990'+NB+'kr/mån.'],'Se alla modeller']];
document.getElementById('out').innerHTML=B.map(([c,nr,desc,eb,h,cta])=>`
 <div class="label"><b>${nr}</b>${desc}</div>
 <a class="bn ${c}" href="index.html#/privatleasing">
  <div class="top"><div class="eyebrow">${eb}</div><h2><span>${h[0]}</span><span class="l2">${h[1]}</span></h2>
   <div class="meta"><span class="cta">${cta}</span><span class="sub">Service ingår. 36 månader, 1${NB}000 mil per år.</span></div></div>
  ${line()}
 </a>`).join('');
</script>
</body>
</html>
