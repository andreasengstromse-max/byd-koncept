<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BYD privatleasing, tre bannerförslag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:#e9ecef;color:#15181c;line-height:1.4}
.page{max-width:1500px;margin:0 auto;padding:28px 20px 60px}
.page>h1{font-size:22px;margin:0 0 4px}
.page>p{margin:0 0 20px;color:#5a626b;font-size:14px}
.label{margin:34px 0 10px;font-size:14px;color:#5a626b}
.label b{color:#15181c;font-size:15px;margin-right:8px}

.bn{position:relative;overflow:hidden;border-radius:14px;isolation:isolate;background-size:cover;display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
.bn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--veil)}
.bn .top{padding:44px 5% 40px;min-height:250px}
.bn .eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.bn h2{margin:8px 0 0;font-weight:700;line-height:1.08;letter-spacing:-.015em;font-size:clamp(28px,3.7vw,54px);max-width:16em}
.bn h2 span{display:block}
.bn .sub{margin:14px 0 0;font-size:clamp(13px,1.15vw,16px);font-weight:500;opacity:.92}
.bn .cta{position:absolute;right:5%;top:48px;padding:13px 26px;border-radius:999px;font-weight:600;font-size:14px;background:var(--btn);color:var(--btnink)}

/* Uppställningen: sju lika breda kolumner, bilarna på samma linje */
.line{position:relative;display:grid;grid-template-columns:repeat(7,1fr);column-gap:1.4%;padding:0 3.2% 26px;margin-top:auto}
.line::before{content:"";position:absolute;left:0;right:0;bottom:0;top:var(--band);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:0}
.col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.car{height:var(--carh);width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.car::after{content:"";position:absolute;left:6%;right:2%;bottom:-3%;height:16%;background:radial-gradient(ellipse at center,rgba(0,0,0,.42),rgba(0,0,0,0) 68%);z-index:-1}
.car img{width:100%;display:block}
.name{margin-top:16px;font-size:clamp(10px,.95vw,13.5px);font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.fr{font-size:11px;opacity:.75;margin-top:2px}
.pr{font-size:clamp(20px,2.3vw,34px);font-weight:800;line-height:1;letter-spacing:-.01em}
.un{font-size:11px;opacity:.75;margin-top:2px}
.trims{margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--rule);width:86%;font-size:clamp(9.5px,.82vw,12px);min-height:5.9em}
.trims div{display:flex;justify-content:space-between;gap:6px;line-height:1.5}
.trims b{font-weight:700}

.b1{--ink:#1d2731;--accent:#c8102e;--btn:#1d2731;--btnink:#fff;--panel:rgba(244,246,248,.86);--rule:rgba(29,39,49,.22);
  --veil:linear-gradient(rgba(244,247,250,.72),rgba(244,247,250,.25) 46%,rgba(244,247,250,0) 60%);
  background-color:#dfe7ee;background-image:url("https://images.unsplash.com/photo-1507281736509-c6289f1ea0f8?auto=format&fit=crop&w=2400&q=75");background-position:center 42%}
.b2{--ink:#fff;--accent:#ffd9a8;--btn:#fff;--btnink:#22262b;--panel:rgba(250,248,245,.9);--rule:rgba(29,39,49,.22);
  --veil:linear-gradient(rgba(20,24,34,.62),rgba(20,24,34,.25) 44%,rgba(20,24,34,0) 62%);
  background-color:#8a7460;background-image:url("https://images.unsplash.com/photo-1611180007172-989e4616a32b?auto=format&fit=crop&w=2400&q=75");background-position:center 38%}
.b2 .line{color:#22262b}
.b3{--ink:#fff;--accent:#8ff0d2;--btn:#fff;--btnink:#0b1d30;--panel:rgba(8,20,36,.72);--rule:rgba(255,255,255,.28);
  --veil:linear-gradient(rgba(4,12,24,.5),rgba(4,12,24,.1) 50%,rgba(4,12,24,0) 62%);
  background-color:#0b1d30;background-image:url("https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=2400&q=75");background-position:center 46%}
.b3 .car::after{background:radial-gradient(ellipse at center,rgba(0,0,0,.7),rgba(0,0,0,0) 68%)}
.bn{--carh:8.4vw;--band:calc(var(--carh) * .62)}
@media (min-width:1500px){.bn{--carh:122px}}

@media (max-width:760px){
  .page{padding:18px 12px 40px}
  .bn{border-radius:10px;--carh:24vw;--band:calc(var(--carh) * .62)}
  .bn .top{padding:30px 22px 0;min-height:0}
  .bn .cta{position:static;display:inline-block;margin:18px 0 26px}
  .bn .sub{font-size:13px}
  .line{grid-template-columns:repeat(2,1fr);column-gap:6%;row-gap:22px;padding:0 6% 22px}
  .col:first-child{grid-column:1/-1}
  .col:first-child .car{width:60%;height:calc(var(--carh) * 1.3)}
  .name{font-size:12px;margin-top:10px}.pr{font-size:24px}
  .trims{display:none}
}
</style>
</head>
<body>
<div class="page">
  <h1>Privatleasing på startsidan, tre bannerförslag</h1>
  <p>Samma uppställning i alla tre: sju modeller i lika breda kolumner på samma linje, med pris per version. Det som skiljer är bakgrundsfotot och budskapet.</p>
  <div id="out"></div>
</div>
<script>
const NB=' ';
const CARS=[
 ['dolphin-g-dmi','Dolphin G DM-i',2990,[['Active',2990],['Boost',3290],['Comfort',3490],['Sport',3690]]],
 ['atto-2-dmi','Atto 2 DM-i',3490,[['Boost',3490]]],
 ['atto-2','Atto 2',3890,[['Comfort',3890]]],
 ['seal-6-dmi-touring','Seal 6 DM-i Touring',3490,[['Boost',3490],['Comfort',3690]]],
 ['atto-3-evo','Atto 3 EVO',4290,[['Design',4290],['Excellence',4690]]],
 ['seal-u-dmi','Seal U DM-i',4190,[['Boost',4190],['Comfort',4290],['Design',4490]]],
 ['sealion-7','Sealion 7',5990,[['Comfort',5990],['Excellence',6190]]]];
const kr=n=>String(n).replace(/(\d)(\d{3})$/,'$1'+NB+'$2');
const line=()=>`<div class="line">${CARS.map(([id,n,p,t])=>`<div class="col">
  <div class="car"><img src="media/cars/${id}.webp" alt="BYD ${n}"></div>
  <div class="name">${n}</div><div class="fr">från</div><div class="pr">${kr(p)}</div><div class="un">kr/mån</div>
  <div class="trims">${t.map(([a,b])=>`<div><span>${a}</span><b>${kr(b)}</b></div>`).join('')}</div></div>`).join('')}</div>`;
const B=[
 ['b1','Förslag 1','Fjällvidd i dagsljus. Ljust och luftigt, närmast din förlaga.','Privatleasing',['Hela BYD-familjen.','Från 2'+NB+'990'+NB+'kr/mån.'],'Se alla modeller'],
 ['b2','Förslag 2','Snötunga granar i lågt vinterljus. Varmare ton.','Privatleasing',['En BYD för varje behov.','Nu med privatleasing från 2'+NB+'990'+NB+'kr/mån.'],'Hitta din BYD'],
 ['b3','Förslag 3','Norrsken över snön. Mörk variant som sticker ut mest.','Vinterns privatleasing',['Hela BYD-familjen.','Från 2'+NB+'990'+NB+'kr/mån.'],'Se alla modeller']];
document.getElementById('out').innerHTML=B.map(([c,nr,desc,eb,h,cta])=>`
 <div class="label"><b>${nr}</b>${desc}</div>
 <a class="bn ${c}" href="index.html#/privatleasing">
  <div class="top"><div class="eyebrow">${eb}</div><h2>${h.map(x=>`<span>${x}</span>`).join('')}</h2>
   <p class="sub">Service ingår. 36 månader, 1${NB}000 mil per år, ingen insats.</p><span class="cta">${cta}</span></div>
  ${line()}
 </a>`).join('');
</script>
</body>
</html>
